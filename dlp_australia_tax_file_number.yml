name: "DLP: Australia Tax File Number"
description: "Detects outbound messages containing validated Australian Tax File Numbers (TFN)."
type: "query"
severity: "medium"
authors:
  - "Security Team"
expression: |
  type.outbound
  and (
    any(body.current_thread.text_lines, regex.contains(., '\b\d{3}\s?\d{3}\s?\d{2,3}\b'))
    or regex.contains(subject, '\b\d{3}\s?\d{3}\s?\d{2,3}\b')
  )
  and (
    strings.icontains(body.current_thread.text, 'tax file number')
    or strings.icontains(body.current_thread.text, 'TFN')
    or strings.icontains(subject, 'tax file number')
    or strings.icontains(subject, 'TFN')
  )
